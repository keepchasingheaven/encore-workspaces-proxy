{{- if and (.Values.rbac.enabled) (not .Values.watchNamespaces) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "encore-workspaces-proxy.fullname" . }}
  labels:
    {{- include "encore-workspaces-proxy.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "encore-workspaces-proxy.fullname" . }}
  labels:
    {{- include "encore-workspaces-proxy.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "encore-workspaces-proxy.serviceAccountName" . }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  name: {{ include "encore-workspaces-proxy.fullname" . }}
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
{{- end }}
