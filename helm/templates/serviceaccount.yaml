apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "encore-workspaces-proxy.serviceAccountName" . }}
  labels:
    {{- include "encore-workspaces-proxy.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
